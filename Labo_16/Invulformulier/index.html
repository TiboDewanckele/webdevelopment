<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="styles/style.css">
    <title>Title</title>
</head>
<body>
    <form method="post">
        <fieldset>
            <legend>Persoonlijke informatie</legend>
            <label for="voornaam">Voornaam*:</label>
            <input type="text" name="voornaam" id="voornaam" placeholder="Your first name" required autofocus>
            <br>
            <label for="achternaam">Achternaam*:</label>
            <input type="text" name="achternaam" id="achternaam" placeholder="Your last name" required>
        </fieldset>
        <fieldset>
            <legend>Sport</legend>
            <p>Welke sport beoefen je?</p>
            <input type="checkbox" name="sport" id="lopen" value="Lopen">
            <label for="lopen">Lopen</label><br>
            <input type="checkbox" name="sport" id="zwemmen" value="Zwemmen">
            <label for="zwemmen">Zwemmen</label><br>
            <input type="checkbox" name="sport" id="roeien" value="Roeien">
            <label for="roeien">Roeien</label><br>
        </fieldset>
        <fieldset>
            <legend>Communicatievoorkeur</legend>
            <p>Hoe kunnen we je bereiken?</p>
            <label for="post"></label><input type="radio" name="communicatie" id="post" value="Per post">Per post<br>
            <label for="mail"></label><input type="radio" name="communicatie" id="mail" value="Per post">E-mail<br>
        </fieldset>
        <fieldset>
            <legend>Favorieten</legend>
            <label for="fav_film">Favoriete film:</label>
            <input type="text" name="fav_film" id="fav_film">
            <br>
            <label for="fav_quote">Favoriete quote: </label>
            <input type="text" name="fav_quote" id="fav_quote" placeholder="Schrijf je favoriete quote">
            <br><br><br>
            <label for="fav_food">Favoriete eten:</label>
            <select id="fav_food" name="fav_food">
                <option value="Hamburger">Hamburger</option>
                <option value="Hot-dog">Hot-dog</option>
                <option value="Pizza">Pizza</option>
            </select><br>
            <label for="fav_browser">Favoriete browser:</label>
            <input type="text" name="fav_browser" id="fav_browser">
        </fieldset>
        <fieldset>
            <legend>Beveiliging & contact</legend>
            <label for="password">Wachtwoord*:</label><input type="password" name="password" id="password" required><br>
            <label for="email">E-mailadres:</label><input type="email" name="email" id="email" placeholder="Geef je e-mailadres in"><br>
            <label for="url">Favoriete site:</label><input type="url" name="url" id="url" placeholder="Geef de URL van je favoriete site"><br>
        </fieldset>
        <fieldset>
            <legend>Extra informatie</legend>
            <label for="klein_getal">Favoriete getal tussen 1 en 10:</label>
            <input type="number" name="klein_getal" id="klein_getal" min="1" max="10">
            <br>
            <label for="groot_getal">Favoriete getal tussen 11 en 1000:</label>
            <input type="range" class="slider" id="groot_getal" value="11" min="11" max="1000">
            <br>
            <label for="geboortedatum">Wanneer ben je geboren?</label>
            <input type="date" name="geboortedatum" id="geboortedatum">
            <br>
            <label for="postcode">Belgische postcode*:</label>
            <input type="text" name="postcode" id="postcode" placeholder="9999"
                   required pattern="^([1-8][0-9]{3}|9[0-8][0-9]{2}|99[0-8][0-9]|999[0-2])$">
        </fieldset>
        <fieldset>
            <legend>Varia</legend>
            <label for="search">Zoeken naar iets:</label><input type="text" name="search" id="search"><br>
            <label for="color">Wat is je lievelingskleur?</label><input type="color" name="color" id="color"><br>
            <label for="file"></label><input type="file" id="file">
        </fieldset>
        <button type="submit">Submit</button>
    </form>
    <script src="scripts/script.js"></script>
</body>
</html>
