<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <form>
        <label for="roker">Is roker</label>
        <input type="checkbox" name="roker" id="roker">
        <br>
        <label id="moedertaal">Moedertaal</label>
        <input type="radio" name="moedertaal" id="nl" value="nl"><label for="nl">Nederlands</label>
        <input type="radio" name="moedertaal" id="fr" value="fr"><label for="fr">Frans</label>
        <input type="radio" name="moedertaal" id="en" value="en"><label for="en">Engels</label>
        <br>
        <label for="buurland">Favoriete buurland</label>
        <select name="buurland" id="buurland">
            <option value="nederland">Nederland</option>
            <option value="frankrijk" selected>Frankrijk</option>
            <option value="duitsland">Duitsland</option>
        </select>
        <br>
        <label for="order">Bestelling</label>
        <select name="bestelling" id="order" multiple>
            <option value="aardappelen">aardappelen</option>
            <option value="brood">brood</option>
            <option value="melk">melk</option>
            <option value="biefstuk">biefstuk</option>
            <option value="chips">chips</option>
            <option value="krant">krant</option>
        </select>
    </form>
    <button id="button">Toon resultaat</button>
    <script src="scripts/script.js"></script>
</body>
</html>
